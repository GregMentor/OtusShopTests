name: CI/CD

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Shop.sln

      - name: Build
        run: dotnet build Shop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Shop.sln --configuration Release --no-build --logger "console;verbosity=detailed"

  cd:
    name: Deploy (starter)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deployment placeholder
        run: |
          echo "CI passed. Replace this step with your deployment script."
          echo "Use GitHub Secrets for tokens/connection strings."
